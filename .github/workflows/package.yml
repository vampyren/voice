name: package

# Builds the installable Arch package so nobody has to clone and build it.
#
# `workflow_dispatch` first, deliberately: this cannot be tested on the
# maintainer's machine (it is Ubuntu, and makepkg needs Arch), so the build is
# proven by running it before a tag is ever cut. Pushing a `v*` tag then builds
# the same way and attaches the result to that tag's release.
#
# CPU-only (`VOICE_GPU=0`). The GPU build carries roughly 3 GB of CUDA runtime
# on top, which would not fit GitHub's 2 GB per-asset limit; anyone who wants it
# builds locally with plain `makepkg -si`, which is what the README says.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed git uv github-cli gnupg

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the PKGBUILD clones this checkout by branch

      - name: Give the build a branch to clone
        # The PKGBUILD's source is `git+file://${startdir}/..#branch=main`, and
        # actions/checkout leaves a detached HEAD. Point a real `main` at
        # whatever was checked out, so a tag builds that tag's code.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A tag build arrives detached and needs the branch created; a manual
          # run on main is already on it, and `git branch -f` refuses to move a
          # branch that is checked out.
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            git branch -f main HEAD
          fi
          git log --oneline -1 main

      - name: Build
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging
          sudo -u builder --preserve-env=VOICE_GPU \
            env VOICE_GPU=0 makepkg -f --noconfirm --nodeps
          ls -lh ./*.pkg.tar.zst

      - name: Check the package contains what it should
        run: |
          cd packaging
          pkg=$(ls ./*.pkg.tar.zst)
          bsdtar -tf "$pkg" | grep -q 'usr/bin/voice'
          bsdtar -tf "$pkg" | grep -q 'usr/share/doc/voice/docs/install.md'
          echo "ok: $pkg"

      - name: Sign it
        # pacman refuses a remote package with no detached signature beside it,
        # so an unsigned release makes the documented `pacman -U <url>` install
        # fail on a 404 for the .sig. Binary, not armoured: that is what
        # `makepkg --sign` produces and what pacman reads.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is not set; the release would be unsigned"
            exit 1
          fi
          printenv GPG_PRIVATE_KEY | gpg --batch --quiet --import
          cd packaging
          for pkg in ./*.pkg.tar.zst; do
            printenv GPG_PASSPHRASE | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --no-armor "$pkg"
            gpg --verify "$pkg.sig" "$pkg"
          done
          ls -l ./*.sig

      - uses: actions/upload-artifact@v4
        with:
          name: voice-cpu-package
          path: |
            packaging/*.pkg.tar.zst
            packaging/*.pkg.tar.zst.sig
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is normally created alongside the tag; make one if not,
          # so a tag pushed on its own still produces something installable.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            packaging/*.pkg.tar.zst packaging/*.pkg.tar.zst.sig --clobber
